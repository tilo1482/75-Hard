<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bulk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<title>Winter Bulk</title>
<script>try{var __t=JSON.parse(localStorage.getItem('bulk26_v1')||'{}').theme;if(__t==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<style>
:root{
  --bg:#0e1216; --card:#151b21; --card2:#1d252d; --line:#2b3640;
  --txt:#eef1f4; --dim:#92a0ad; --acc:#5f8fbf; --accD:#223a52; --onAcc:#0a1626;
  --pro:#ff8a3d; --carb:#b7c4d1; --water:#7fb2e0; --good:#4fc08d; --warn:#fbbf24; --bad:#ff4d6d;
  color-scheme:dark;
}
[data-theme=light]{--bg:#f1f3f5;--card:#ffffff;--card2:#e3e7eb;--line:#d0d6dc;--txt:#141a20;--dim:#647282;--acc:#3a6ea5;--accD:#dbe6f2;--onAcc:#ffffff;--pro:#e06a14;--carb:#5d7184;--water:#4a86c0;--good:#2f9e6e;--warn:#b7791f;--bad:#d6284a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--txt)}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
.num{font-family:'Rajdhani',-apple-system,sans-serif;font-weight:700;letter-spacing:.3px}

/* header */
#hdr{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 8px 6px;text-align:center}
#hdr .hrow.asym{padding-left:6px}
#hdr .hctl{position:absolute;right:-2px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px}
#hdr .thm{width:38px;height:24px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
#hdr .thm .knob{position:absolute;top:1px;left:15px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--onAcc);display:grid;place-items:center;transition:left .24s}
#hdr .thm.lt .knob{left:1px}
#hdr .gearb{width:30px;height:34px;display:grid;place-items:center;color:var(--dim);border-radius:12px}
#hdr .gearb svg{width:24px;height:24px}
#hdr .gearb:active{color:var(--acc)}
#hdr .hrow{display:flex;align-items:center;justify-content:center;gap:0;position:relative;padding:0 72px}
#hdr .tline{display:flex;align-items:baseline;justify-content:center;gap:calc(10px + .03em + .3px);min-width:0;font-size:var(--hs,50px)}
#hdr h1,#hdr .dt{margin:0;font-size:var(--hs,50px);line-height:1;text-transform:uppercase;white-space:nowrap;flex:none;color:var(--txt);letter-spacing:-.03em;word-spacing:calc(.03em + .3px)}
#hdr .sub{color:var(--dim);font-size:14px;margin-top:6px}
#hdr .jump{margin-top:8px;padding:5px 12px;font-size:12px}
#hdr .arr{color:var(--dim);padding:8px 2px;display:grid;place-items:center;flex:none}
#hdr .arr svg{width:26px;height:26px}
#hdr .arr:active{color:var(--acc)}
.iconBtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.iconBtn svg{width:19px;height:19px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
#nav .in{display:flex;width:100%;max-width:540px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600;border-radius:12px;position:relative}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--acc)}
#nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card h2 .r{letter-spacing:0;text-transform:none;font-weight:600;font-size:13px;color:var(--acc)}
.sec{font-size:12px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:700;margin:20px 2px 8px}
.hint{color:var(--dim);font-size:13px;line-height:1.4}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--dim)}
.pill.acc{background:var(--accD);color:var(--acc)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--acc);color:var(--onAcc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--accD);border-color:var(--acc);color:var(--acc)}

/* rings */
.rings{display:flex;gap:14px;justify-content:space-around}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--card2);stroke-width:9}
.ring .rf{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-family:'Rajdhani',sans-serif;font-size:34px;line-height:1}
.ring .rc span{font-size:12px;color:var(--dim);margin-top:2px;text-align:center;line-height:1.2}

.wkbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;width:100%;min-height:128px;padding:18px 16px;margin-bottom:14px;border-radius:22px;border:0;background:var(--acc);color:var(--onAcc);font:inherit;cursor:pointer}
.wkbtn .wl{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;display:inline-flex;gap:6px;align-items:center}
.wkbtn .wn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:58px;line-height:1}
.wkbtn .wf{font-size:15px;font-weight:700;opacity:.85}
.parts.top{margin:0 0 10px;gap:10px}.parts.top .part{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 6px 16px}.parts.top .part b{font-size:34px}.parts.top .part i{margin-bottom:8px}.togo.top{margin:0 0 14px}
.dsc0{margin:12px 0 14px}.dsc0 .big{position:relative;width:240px;height:240px;margin:0 auto}.dsc0 .big svg{width:100%;height:100%}.dsc0 .big .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.dsc0 .big .rc b{font-family:'Rajdhani',sans-serif;font-size:70px;line-height:.9}.dsc0 .big .rc b small{font-size:28px;color:var(--dim)}.dsc0 .big .rc span{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}.dsc0 .big .rc.full b{color:var(--good)}
.seg.sz{margin:0 0 12px;max-width:190px}.outlbl .seg.sz{margin:0;font-size:12px}
.pday.now{border-color:var(--acc)}.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.prow .pl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}.prow .t{font-weight:700}
.outlbl{margin:16px 4px 8px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}.card.tap{cursor:pointer;margin-top:0}
.dsc{padding:18px 14px 14px}
.dsc .big{position:relative;width:204px;height:204px;margin:0 auto}
.dsc .big svg{width:100%;height:100%}
.dsc .big .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dsc .big .rc b{font-family:'Rajdhani',sans-serif;font-size:60px;line-height:.9}
.dsc .big .rc b small{font-size:28px;color:var(--dim)}
.dsc .big .rc span{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.dsc .big .rc.full b{color:var(--good)}
.parts{display:grid;gap:8px;margin-top:16px}
.parts.p3{grid-template-columns:repeat(3,1fr)}.parts.p2{grid-template-columns:repeat(2,1fr)}
.part{background:var(--card2);border:0;border-radius:14px;padding:10px 6px 11px;text-align:center;color:var(--txt);font:inherit;cursor:pointer}
.part i{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 5px}
.part b{font-family:'Rajdhani',sans-serif;font-size:22px;line-height:1;display:block}
.part span{display:block;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.part small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.wkbars{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:6px}
.wkbars div{flex:1;text-align:center;font-size:11px;color:var(--dim);font-weight:700;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.wkbars div u{display:block;text-decoration:none;border-radius:8px 8px 4px 4px;background:var(--card2);min-height:6px;margin-bottom:5px}
.wkbars div.f u{background:var(--good)}.wkbars div.p u{background:var(--acc)}
.wkbars div.now{color:var(--txt)}
.ringLbl{text-align:center;font-size:12px;color:var(--dim);margin-top:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.togo{text-align:center;margin-top:12px;font-size:14px;color:var(--dim)}
.togo b{color:var(--txt)}

/* meal rows */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;background:none}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.chk.sq{border-radius:9px}
.mbody{flex:1;min-width:0}
.mbody .t{font-weight:700;line-height:1.2}
.mbody .s{font-size:13px;color:var(--dim);margin-top:2px}
.slotTag{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--acc);text-transform:uppercase}
.chev{color:var(--dim);width:18px;height:18px;flex:none}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--dim);font-weight:600;font-size:14px}

/* meter */
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:18px}

/* planner */
.dayHd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dayHd b{font-size:17px}
.dayHd .tot{margin-left:auto;font-size:13px;color:var(--dim)}
.dayCard.today{border-color:var(--acc)}
.pslot{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.pslot:first-of-type{border-top:0}
.pslot .l{width:24px;height:24px;border-radius:8px;background:var(--card2);font-size:12px;font-weight:800;display:grid;place-items:center;color:var(--acc);flex:none}
.pslot .n{flex:1;font-size:15px;font-weight:600;line-height:1.2;min-width:0}
.pslot .n small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.pslot .n.none{color:var(--dim);font-weight:500}
.pslot .ok{color:var(--good);width:18px;height:18px}

/* groceries */
.gro{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.gro:first-of-type{border-top:0}
.gro .nm{flex:1}
.gro.done .nm{opacity:.4;text-decoration:line-through}
.gro .nm small.sub{display:block;color:var(--dim);font-size:13px;margin-top:1px}
.gro .nm small.sub.eb{color:var(--bad);font-weight:700}
.gro .nm small.sub.ew{color:var(--warn);font-weight:700}
.gro.covered{opacity:.55}
.gro .okc{width:26px;height:26px;display:grid;place-items:center;color:var(--good);flex:none}
.exwarn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.exwarn .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.exwarn b{display:block;margin-bottom:4px}
.exwarn .r:first-of-type{border-top:0}
.exwarn .warn{color:var(--warn);font-weight:700}
.exwarn .bad,.eb{color:var(--bad);font-weight:700}
.ew{color:var(--warn);font-weight:700}
.chkrow{display:flex;align-items:center;gap:10px;font-size:15px;margin:12px 0 4px}
.chkrow input{width:20px;height:20px;accent-color:var(--acc)}
.lprow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lprow label{flex:1;font-size:15px}
.lprow input{width:92px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:right;font-size:16px}
.lprow .u{width:56px;color:var(--dim);font-size:13px}
.gro .q{color:var(--dim);font-size:14px;text-align:right}

/* workout */
.dpills{display:flex;gap:4px;margin:0 -16px 14px;padding:0 6px}
.dpills::-webkit-scrollbar{display:none}
.dpill{flex:1 1 0;min-width:0;padding:8px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center}
.dpill b{display:block;font-size:11px;color:var(--dim);letter-spacing:1px}
.dpill span{font-size:12px;font-weight:700;display:block;line-height:1.15}
.dpill.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.dpill.on b{color:var(--onAcc)}
.dpill.done b::after{content:'';display:inline-block;width:10px;height:10px;margin-left:4px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M5 12.5l4.5 4.5L19 7.5%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M5 12.5l4.5 4.5L19 7.5%22/%3E%3C/svg%3E") center/contain no-repeat}
.dpill.today:not(.on){border-color:var(--acc)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ex.complete{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.ex .eh{display:flex;gap:10px;align-items:flex-start}
.ex .eh b{font-size:17px;line-height:1.2}
.ex .tag{font-size:13px;color:var(--dim);margin-top:3px}
.ex .note{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.35}
.ex .note::before{content:'';display:inline-block;width:15px;height:15px;margin-right:6px;vertical-align:-2px;background:var(--acc);-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z%22/%3E%3C/svg%3E") center/contain no-repeat}
.sug{margin-top:10px;background:var(--card2);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.4}
.sug b{color:var(--acc)}
.srow{display:flex;align-items:center;gap:8px;margin-top:10px}
.srow .sn{width:20px;text-align:center;color:var(--dim);font-weight:800;font-size:14px}
.srow input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center;font-size:18px;font-weight:700}
.srow input::placeholder{color:var(--dim);opacity:.55;font-weight:600}
.srow input:focus{outline:2px solid var(--acc);border-color:transparent}
.srow .x{color:var(--dim);font-size:13px;flex:none}
.srow.done input{opacity:.6}
.supers{font-size:11px;font-weight:800;color:var(--pro);letter-spacing:1px;margin-top:6px}

/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;
  background:var(--acc);color:var(--onAcc);border-radius:99px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
#timer.on{display:flex}
#timer b{font-family:'Rajdhani',sans-serif;font-size:24px}
#timer button{background:rgba(0,0,0,.18);border-radius:99px;padding:6px 11px;font-weight:800;font-size:13px}

/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#ov.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  max-height:88vh;overflow-y:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .33s,visibility .33s;
  max-width:560px;margin:0 auto}
#sheet.on{transform:none;visibility:visible}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
#sheet h3{margin:0 0 4px;font-size:22px}
.fld{margin-top:14px}
.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:17px}
.fld input:focus,.fld select:focus{outline:2px solid var(--acc);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-top:10px}
.mcard .mi{flex:1;min-width:0}
.mcard .t{font-weight:800}
.mcard .s{color:var(--acc);font-size:14px;font-weight:700;margin-top:1px}
.mcard .d{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lnk{color:var(--dim);font-size:13px;text-decoration:underline;margin-top:6px;padding:0}
.nrings{display:flex;justify-content:space-between;margin:8px 0 18px}.nrings .ring{width:calc((min(100vw,540px) - 32px)/3);height:calc((min(100vw,540px) - 32px)/3)}.nrings .rc b{font-size:clamp(28px,8.2vw,40px)}.nrings .rc span{font-size:11px}
.nrings .ringLbl{font-size:12px;margin-top:8px}
.rings.r3{gap:2px}
.rings.r3 .ring{width:112px;height:112px}
.rings.r3 .rc b{font-size:29px}
.rings.r3 .rc span{font-size:11px}
.qrow{display:flex;gap:6px;margin-top:8px}
.qrow input{flex:1;min-width:0;width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-size:16px;text-align:center}
.qrow .btn{flex:none;padding:0 16px}
.rings.r3 .ringLbl{font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.tile b{font-family:'Rajdhani',sans-serif;font-size:30px;line-height:1;display:block}
.tile b small{font-size:15px;color:var(--dim);font-weight:600}
.tile span{display:block;margin-top:5px;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.libbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px 16px;font-size:19px;margin-top:12px}
.habhd{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.habch{display:grid;place-items:center;color:var(--dim);transform:rotate(90deg);transition:transform .2s}
.habch.open{transform:rotate(-90deg)}
.lift+.lift{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}
.pick.on{border-color:var(--acc);background:var(--accD)}
.pick .t{font-weight:800;display:flex;justify-content:space-between;gap:8px}
.pick .t span{color:var(--acc);font-size:14px;white-space:nowrap}
.pick .d{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.33s;z-index:60;max-width:90%;text-align:center}
#toast svg{vertical-align:-4px;margin-right:2px}
.ico{vertical-align:-3px;flex:none}
.bigico{color:var(--acc);display:flex;justify-content:center;margin-bottom:6px}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* progress */
.big{font-family:'Rajdhani',sans-serif;font-size:46px;font-weight:700;line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--dim)}
.wk{display:grid;grid-template-columns:34px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;text-align:center}
.wk.hd{color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-top:0}
.wk.cur{background:var(--accD);border-radius:10px}
.wk.fut{opacity:.35}
.wk b:first-child{text-align:left;padding-left:6px}
.goal{margin-bottom:14px}
.goal .gh{display:flex;justify-content:space-between;align-items:baseline}
.goal .gh b{font-size:17px}
.track{position:relative;height:12px;border-radius:99px;background:var(--card2);margin:10px 0 6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc)}
.track u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--txt);opacity:.8}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{aspect-ratio:3/4;border-radius:12px;background:var(--card2) center/cover;position:relative;overflow:hidden}
.photos .ph span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;font-weight:700;padding:14px 6px 5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .ph{aspect-ratio:3/4;border-radius:12px;background:var(--card2) center/cover}
.welcome{background:linear-gradient(135deg,var(--accD),var(--card));border-color:var(--acc)}
.step{display:flex;align-items:center;gap:12px;padding:9px 0}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tip{font-size:13px;color:var(--dim);background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.4}
.divider{height:1px;background:var(--line);margin:12px 0}
#app{touch-action:pan-y}#nb{position:fixed;top:0;left:0;right:0;height:100vh;overflow:hidden;z-index:4;background:var(--bg);pointer-events:none}#pg{overflow-x:clip}

/* ===== DEPTH / 3D ===== */
:root{--hi:rgba(255,255,255,.09);--grad:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,0) 55%);
 --sh-c:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(0,0,0,.3),0 16px 28px -14px rgba(0,0,0,.85),0 5px 10px rgba(0,0,0,.4);
 --sh-s:inset 0 1px 0 var(--hi),0 6px 10px -4px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4);
 --sh-in:inset 0 3px 7px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.05);
 --bgfx:radial-gradient(120% 42% at 50% -4%,color-mix(in srgb,var(--acc) 14%,var(--bg)),var(--bg) 72%)}
[data-theme=light]{--hi:rgba(255,255,255,1);--grad:linear-gradient(180deg,rgba(255,255,255,0),rgba(14,100,130,.06));
 --sh-c:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(14,60,80,.07),0 16px 28px -14px rgba(14,70,95,.42),0 4px 10px rgba(14,70,95,.14);
 --sh-s:inset 0 1px 0 #fff,0 6px 10px -4px rgba(14,70,95,.3),0 1px 2px rgba(14,70,95,.18);
 --sh-in:inset 0 3px 6px rgba(14,70,95,.18),inset 0 -1px 0 #fff;
 --bgfx:radial-gradient(120% 42% at 50% -4%,color-mix(in srgb,var(--acc) 16%,#fff),var(--bg) 72%)}
body{background:var(--bgfx),var(--bg);background-attachment:fixed}
#nb{background:var(--bgfx),var(--bg)}
.card,.tile,.parts.top .part,.mcard,.ex,.pick,.seg,.dpill,.iconBtn{background-image:var(--grad);box-shadow:var(--sh-c)}
.part,.chip,.stepper button,.pill,.sug,.tip{box-shadow:var(--sh-s)}
.parts.top .part{box-shadow:var(--sh-c)}
.fld input,.fld select,.qrow input,.srow input,.lprow input,.bar,.track{box-shadow:var(--sh-in)}
.btn{box-shadow:inset 0 1px 0 var(--hi),0 4px 0 rgba(0,0,0,.38),0 10px 14px -6px rgba(0,0,0,.55);transition:transform .1s,box-shadow .1s}
[data-theme=light] .btn{box-shadow:inset 0 1px 0 #fff,0 4px 0 rgba(14,70,95,.22),0 10px 14px -6px rgba(14,70,95,.35)}
.btn.pri,.wkbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12),0 5px 0 color-mix(in srgb,var(--acc) 48%,#000),0 14px 20px -6px color-mix(in srgb,var(--acc) 55%,transparent)}
.wkbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.12),0 7px 0 color-mix(in srgb,var(--acc) 48%,#000),0 18px 26px -8px color-mix(in srgb,var(--acc) 55%,transparent);margin-bottom:20px;transition:transform .1s,box-shadow .1s}
.btn.sm{box-shadow:inset 0 1px 0 var(--hi),0 3px 0 rgba(0,0,0,.35),0 6px 10px -4px rgba(0,0,0,.5)}
.btn.pri.sm{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 color-mix(in srgb,var(--acc) 48%,#000),0 8px 12px -4px color-mix(in srgb,var(--acc) 50%,transparent)}
.btn.ghost{box-shadow:none}
.btn:active,.wkbtn:active{transform:translateY(4px);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 0 0 rgba(0,0,0,0)}
.chip.on{box-shadow:inset 0 1px 0 var(--hi),0 0 14px -2px color-mix(in srgb,var(--acc) 50%,transparent)}
.dpill.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 color-mix(in srgb,var(--acc) 48%,#000),0 10px 14px -4px color-mix(in srgb,var(--acc) 50%,transparent)}
.seg button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--acc) 48%,#000),0 6px 10px -3px color-mix(in srgb,var(--acc) 45%,transparent)}
.pday.now{box-shadow:var(--sh-c),0 0 0 1px var(--acc),0 0 22px -4px color-mix(in srgb,var(--acc) 55%,transparent)}
.ring svg,.dsc0 .big svg{filter:drop-shadow(0 7px 7px rgba(0,0,0,.5))}
[data-theme=light] .ring svg,[data-theme=light] .dsc0 .big svg{filter:drop-shadow(0 7px 7px rgba(14,70,95,.28))}
.chk{box-shadow:var(--sh-in)}.chk.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px color-mix(in srgb,var(--acc) 50%,transparent)}
#hdr .thm{box-shadow:var(--sh-in)}#hdr .thm .knob{box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4)}
#nav{box-shadow:0 -12px 30px rgba(0,0,0,.35),inset 0 1px 0 var(--hi)}[data-theme=light] #nav{box-shadow:0 -10px 28px rgba(14,70,95,.16),inset 0 1px 0 #fff}
#sheet{box-shadow:0 -24px 60px rgba(0,0,0,.6),inset 0 1px 0 var(--hi)}
#toast{box-shadow:0 12px 26px rgba(0,0,0,.5)}


/* ===== LIQUID GLASS ===== */
:root{--orbs:radial-gradient(65% 34% at 8% 4%,rgba(30,144,255,.55),transparent 72%),radial-gradient(55% 30% at 104% 30%,rgba(0,224,198,.30),transparent 72%),radial-gradient(70% 36% at -6% 72%,rgba(30,144,255,.38),transparent 72%),radial-gradient(60% 30% at 100% 102%,rgba(0,224,198,.26),transparent 72%);
 --gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.11);--glb:rgba(255,255,255,.17);--glin:rgba(0,0,0,.28);
 --glsheen:linear-gradient(135deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.05) 32%,rgba(255,255,255,0) 58%,rgba(255,255,255,.05) 100%);
 --glsh:inset 1px 1px 0 rgba(255,255,255,.38),inset -1px -1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(255,255,255,.05),0 14px 32px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.25);
 --glsm:inset 1px 1px 0 rgba(255,255,255,.32),inset -1px -1px 0 rgba(255,255,255,.06),0 6px 14px -6px rgba(0,0,0,.5);
 --glblur:blur(22px) saturate(180%);--glpane:rgba(8,26,42,.62)}
[data-theme=light]{--orbs:radial-gradient(65% 34% at 8% 4%,rgba(30,144,255,.40),transparent 72%),radial-gradient(55% 30% at 104% 30%,rgba(0,200,180,.28),transparent 72%),radial-gradient(70% 36% at -6% 72%,rgba(80,170,255,.38),transparent 72%),radial-gradient(60% 30% at 100% 102%,rgba(0,200,180,.24),transparent 72%);
 --gl:rgba(255,255,255,.50);--gl2:rgba(255,255,255,.62);--glb:rgba(255,255,255,.85);--glin:rgba(255,255,255,.55);
 --glsheen:linear-gradient(135deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.18) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.2) 100%);
 --glsh:inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(255,255,255,.5),0 14px 30px -10px rgba(14,80,120,.35),0 2px 6px rgba(14,80,120,.12);
 --glsm:inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(14,80,120,.3);
 --glpane:rgba(236,247,255,.72)}
body{background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--orbs);pointer-events:none}
#nb{background:var(--bg) var(--orbs)}
/* big surfaces: real glass */
:root:root .card,:root:root .parts.top .part,:root:root .mcard,:root:root .ex,:root:root .pick,:root:root .seg,:root:root .dpill,:root:root .iconBtn,:root:root .pday{background:var(--glsheen),var(--gl);border:1px solid var(--glb);box-shadow:var(--glsh);-webkit-backdrop-filter:var(--glblur);backdrop-filter:var(--glblur)}
/* small inner pieces: light frost, no extra blur */
:root:root .part,:root:root .chip,:root:root .stepper button,:root:root .sug,:root:root .tip,:root:root .pill{background:var(--gl2);border-color:var(--glb);box-shadow:var(--glsm)}
:root:root .pill.acc{background:color-mix(in srgb,var(--acc) 26%,transparent)}
:root:root .pill.good{background:color-mix(in srgb,var(--good) 22%,transparent)}:root:root .pill.warn{background:color-mix(in srgb,var(--warn) 24%,transparent)}:root:root .pill.bad{background:color-mix(in srgb,var(--bad) 24%,transparent)}
:root:root .parts.top .part{background:var(--glsheen),var(--gl)}
/* buttons */
:root:root .btn{background:var(--glsheen),var(--gl2);border:1px solid var(--glb);box-shadow:var(--glsm);-webkit-backdrop-filter:var(--glblur);backdrop-filter:var(--glblur);transition:transform .15s,box-shadow .15s}
:root:root .btn.ghost{background:none;box-shadow:none;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
:root:root .btn.pri,:root:root .wkbtn{background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 48%),color-mix(in srgb,var(--acc) 82%,transparent);border:1px solid rgba(255,255,255,.45);color:var(--onAcc);
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.65),inset -1px -1px 0 rgba(255,255,255,.18),inset 0 -10px 18px -8px rgba(255,255,255,.25),0 14px 28px -8px color-mix(in srgb,var(--acc) 65%,transparent),0 2px 6px rgba(0,0,0,.2)}
:root:root .btn.pri.sm{box-shadow:inset 1px 1px 0 rgba(255,255,255,.65),inset -1px -1px 0 rgba(255,255,255,.18),0 8px 16px -6px color-mix(in srgb,var(--acc) 60%,transparent)}
:root:root .wkbtn{border-radius:26px}
:root:root .btn:active,:root:root .wkbtn:active{transform:scale(.965);box-shadow:inset 0 2px 8px rgba(0,0,0,.25),0 2px 8px -4px rgba(0,0,0,.4)}
/* selected states: tinted glass */
:root:root .seg button.on,:root:root .dpill.on{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%),color-mix(in srgb,var(--acc) 85%,transparent);border-color:rgba(255,255,255,.5);color:var(--onAcc);box-shadow:inset 1px 1px 0 rgba(255,255,255,.7),0 6px 14px -4px color-mix(in srgb,var(--acc) 60%,transparent)}
:root:root .chip.on{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:var(--acc);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),0 0 16px -2px color-mix(in srgb,var(--acc) 55%,transparent)}
:root:root .dpill.today:not(.on){border-color:var(--acc)}
:root:root .chk{background:var(--glin);border-color:var(--glb);box-shadow:var(--sh-in)}
:root:root .chk.on{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,255,255,.5);box-shadow:inset 1px 1px 0 rgba(255,255,255,.7),0 3px 10px color-mix(in srgb,var(--acc) 55%,transparent)}
/* inputs: recessed glass */
:root:root .fld input,:root:root .fld select,:root:root .qrow input,:root:root .srow input,:root:root .lprow input,:root:root input[type=text],:root:root input[type=number],:root:root input[type=date],:root:root select{background:var(--glin);border-color:var(--glb);box-shadow:var(--sh-in)}
:root:root .bar,:root:root .track{background:var(--glin);box-shadow:var(--sh-in)}
:root:root #hdr .thm{background:var(--glin);border-color:var(--glb)}
/* chrome */
:root:root #nav{background:color-mix(in srgb,var(--glpane) 100%,var(--bg) 0%);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border-top:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 -14px 34px rgba(0,0,0,.25)}
:root:root #nav button.on{background:var(--gl2);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(255,255,255,.06)}
:root:root #sheet{background:var(--glsheen),var(--glpane);-webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);border-top:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 -24px 60px rgba(0,0,0,.45)}
:root:root #sheet .grab{background:var(--glb)}
:root:root #ov{background:rgba(2,10,18,.38);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
:root:root #timer button{background:var(--gl2)}
:root:root #toast{background:var(--glsheen),var(--glpane);color:var(--txt);border:1px solid var(--glb);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glsh)}
:root:root #timer{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 50%),color-mix(in srgb,var(--acc) 82%,transparent);color:var(--onAcc);border:1px solid rgba(255,255,255,.45);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 12px 28px -6px color-mix(in srgb,var(--acc) 60%,transparent)}
:root:root #toast{background:var(--glsheen),var(--glpane);color:var(--txt);border:1px solid var(--glb);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glsh)}
:root:root #timer{color:var(--txt);background:var(--glsheen),var(--glpane);border:1px solid var(--glb);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}


/* ===== GLASS v2: crisp / shiny ===== */
:root{--orbs:radial-gradient(95% 52% at 0% 0%,rgba(95,143,191,.17),transparent 75%),radial-gradient(90% 50% at 100% 20%,rgba(120,140,160,.11),transparent 75%),radial-gradient(90% 50% at 25% 45%,rgba(95,143,191,.10),transparent 75%),radial-gradient(95% 52% at 100% 62%,rgba(95,143,191,.14),transparent 75%),radial-gradient(95% 52% at 0% 82%,rgba(95,143,191,.15),transparent 75%),radial-gradient(90% 50% at 90% 100%,rgba(120,140,160,.11),transparent 75%);
 --rim:linear-gradient(135deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.30) 16%,rgba(255,255,255,.05) 42%,rgba(175,200,225,.12) 72%,rgba(255,255,255,.70) 100%);
 --clear:linear-gradient(rgba(200,215,230,.05),rgba(200,215,230,.05));
 --gloss:linear-gradient(165deg,rgba(255,255,255,.24) 0,rgba(255,255,255,.08) 24%,rgba(255,255,255,0) 24.8%);
 --edge:inset 0 1px 0 rgba(255,255,255,.65),inset 0 14px 16px -16px rgba(255,255,255,.55),inset 0 -1px 0 rgba(150,185,220,.35),inset 0 -18px 22px -20px rgba(100,160,215,.55);
 --drop:0 20px 36px -16px rgba(0,0,0,.65),0 3px 6px rgba(0,0,0,.28);
 --crisp:blur(10px) saturate(210%) brightness(1.1) contrast(1.05)}
[data-theme=light]{--orbs:radial-gradient(95% 52% at 0% 0%,rgba(95,143,191,.16),transparent 75%),radial-gradient(90% 50% at 100% 20%,rgba(120,140,160,.12),transparent 75%),radial-gradient(90% 50% at 25% 45%,rgba(95,143,191,.09),transparent 75%),radial-gradient(95% 52% at 100% 62%,rgba(95,143,191,.12),transparent 75%),radial-gradient(95% 52% at 0% 82%,rgba(95,143,191,.13),transparent 75%),radial-gradient(90% 50% at 90% 100%,rgba(120,140,160,.11),transparent 75%);

/* ============ TRAINING LOGIC ============ */
function e1rm(w,r){if(!w||!r)return 0;if(r<=1)return w;return w*(1+Math.min(r,12)/30)}
function doneSets(date,id){const wk=S.workouts[date];if(!wk||!wk.ex[id])return [];return wk.ex[id].filter(s=>s&&s.done&&(s.r>0))}
function lastSession(id,before){const ds=Object.keys(S.workouts).filter(d=>d<before).sort().reverse();
 for(const d of ds){const s=doneSets(d,id);if(s.length)return {d,sets:s}}return null}
function suggest(ex,date){const L=lastSession(ex.id,date);
 if(!L)return {first:true};
 const ws=L.sets.map(s=>+s.w||0),top=Math.max(...ws),reps=L.sets.map(s=>+s.r||0);
 const allHit=L.sets.length>=ex.s&&reps.every(r=>r>=ex.hi);
 const desc=L.sets.map(s=>(+s.w?s.w:'BW')+'×'+s.r).join(', ');
 if(ex.t){const nr=Math.min(...reps)+5;return {w:0,r:nr,txt:'Last: '+reps.join(', ')+' sec',goal:'Aim for '+nr+' sec each.'}}
 if(allHit&&top>0&&ex.inc){const nw=r1(top+ex.inc);return {w:nw,r:ex.lo,up:true,txt:'Last: '+desc,goal:'You hit the top of the range. <b>Go up to '+nw+' lb</b> and aim for '+ex.lo+'+ reps.'}}
 if(allHit&&!top){return {w:0,r:reps[0]+1,txt:'Last: '+desc,goal:'Add a rep or two — or add weight.'}}
 return {w:top,r:Math.min(ex.hi,Math.min(...reps)+1),txt:'Last: '+desc,goal:'Same weight (<b>'+(top||'BW')+'</b>). Beat last time — aim for '+Math.min(ex.hi,Math.min(...reps)+1)+'+ reps per set.'}}

function baseFor(g){ // baseline = best est. 1RM from the FIRST session where the lift was logged
 const ds=Object.keys(S.workouts).sort();
 for(const d of ds){const s=doneSets(d,g.ex);if(s.length){let best=0,bw=0,br=0;s.forEach(x=>{const e=e1rm(+x.w,+x.r);if(e>best){best=e;bw=+x.w;br=+x.r}});if(best>0)return {d,e:best,w:bw,r:br}}}
 return null}
function bestFor(g){let best=0,d0=null;Object.keys(S.workouts).forEach(d=>{doneSets(d,g.ex).forEach(x=>{const e=e1rm(+x.w,+x.r);if(e>best){best=e;d0=d}})});return best?{e:best,d:d0}:null}
function goalStatus(g){const b=baseFor(g),c=bestFor(g);if(!b||!c)return {none:true};
 const t0=P(b.d).getTime(),t1=P(GOALDATE).getTime(),tn=Math.min(Date.now(),t1);
 const frac=t1>t0?Math.max(0,Math.min(1,(tn-t0)/(t1-t0))):1;
 const exp=b.e+(g.goal-b.e)*frac;const diff=c.e-exp;
 return {b,c,exp,diff,pct:Math.max(0,Math.min(1,(c.e-b.e)/Math.max(1,g.goal-b.e))),expPct:frac,left:Math.max(0,g.goal-c.e)}}

 for(let i=0;i<7;i++){const d=addD(mon,i);if(hasLog(d)){const t=dayTotals(d);cs+=t.c;ps+=t.p;n++;tg+=calTarget(d);if(t.p>=S.pro-10)pd++}}

let _db=null;const _mem={};
function idbOpen(){return new Promise(res=>{if(_db)return res(_db);try{const r=indexedDB.open('bulk26',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}

async function idbDel(id){delete _mem[id];const db=await idbOpen();if(!db)return;return new Promise(res=>{try{const t=db.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}

 let h=`<h3>Training program</h3><div class="hint">Pick your goal and how many days you can train. The app builds the split for you.</div>
 <div class="fld"><label>Lift goal</label><div class="chips">${GORDER.map(g=>`<button class="chip ${pg.goal===g?'on':''}" onclick="pgSet('goal','${g}')">${GP[g].n}</button>`).join('')}</div><div class="hint" style="margin-top:10px">${G.desc}</div></div>
 <div class="fld"><label>Days per week</label><div class="chips">${[2,3,4,5,6].map(n=>`<button class="chip ${pg.days===n?'on':''}" onclick="pgSet('days',${n})">${n}</button>`).join('')}</div><div class="hint" style="margin-top:10px"><b style="color:var(--txt)">${pr.split}.</b> ${DAYD[pg.days]}</div></div>
 <div class="fld"><label>Your week · ~${nex} exercises per session</label><div class="card" style="padding:4px 14px;margin:0">${sched}</div></div>`;
 if(pg.goal!==S.prefs.goal)h+=`<button class="pick ${pg.setCal?'on':''}" style="margin-top:14px" onclick="UI.pg.setCal=!UI.pg.setCal;drawProgram()"><div class="t"><span style="color:var(--txt)">Also set my calorie target to ${fmtN(G.cal)}</span><span>${pg.setCal?'ON':'OFF'}</span></div><div class="d">Now ${fmtN(S.cal)} kcal. Estimated from a ~3,100 kcal maintenance, and your weekly report fine-tunes it. Your meal presets are built for the bulk, so on other goals you will mix portions or use "Something else".</div></button>`;
 h+=`<button class="btn pri full" style="margin-top:16px${isCur?';opacity:.5':''}" ${isCur?'disabled':''} onclick="applyProgram()">${isCur?'This is your current program':'Apply this program'}</button>`;
 openSheet(h,true)}
function dayForDowIn(pr,dow){return pr.order.find(k=>pr.days[k].dow===dow)||null}
function applyProgram(){const pg=UI.pg,G=GP[pg.goal];S.prefs={goal:pg.goal,days:pg.days};
 if(pg.setCal&&pg.goal!==undefined){S.cal=G.cal;S.calHist.push({d:today(),cal:S.cal})}
 setProg();UI.trainDay=null;UI.restDow=null;save();closeSheet();render();toast(G.n+' · '+pg.days+' days/week applied')}

/* ============ SETTINGS / BACKUP ============ */
function applyTheme(){const l=S.theme==='light';document.documentElement.setAttribute('data-theme',l?'light':'dark');
 const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',l?'#f1f3f5':'#0e1216')}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';save();applyTheme();render()}
function settingsSheet(){
 openSheet(`<h3>Settings</h3>
 <div class="grid2"><div class="fld"><label>Calories / day</label><input id="s_c" type="text" inputmode="numeric" value="${S.cal}"></div><div class="fld"><label>Protein (g)</label><input id="s_p" type="text" inputmode="numeric" value="${S.pro}"></div></div>
 <div class="fld"><label>Water (oz / day)</label><input id="s_w" type="text" inputmode="numeric" value="${S.water}"></div>
 <button class="btn pri full" style="margin-top:14px" onclick="saveSettings()">Save targets</button>
 <div class="divider" style="margin:20px 0"></div>
 <b>Reminders</b><div class="hint" style="margin:4px 0 10px">${remStatus()}</div>
 <div class="fld"><label>Reminder server address</label><input id="n_u" type="text" autocapitalize="off" autocorrect="off" placeholder="https://bulk-reminders.yourname.workers.dev" value="${esc(nCfg().url||'')}"></div>
 <div class="fld"><label>App key</label><input id="n_k" type="text" autocapitalize="off" autocorrect="off" placeholder="Paste your app key" value="${esc(nCfg().key||'')}"></div>
 <div class="row"><button class="btn pri sp" onclick="enableNotifs()">${nCfg().on?'Update':'Turn on'}</button><button class="btn sp" onclick="testNotif()">Send test</button>${nCfg().on?'<button class="btn sp danger" onclick="disableNotifs()">Turn off</button>':''}</div>
 <div class="divider" style="margin:20px 0"></div>
 <b>Training program</b><div class="hint" style="margin:4px 0 10px">${GP[S.prefs.goal].n} · ${S.prefs.days} days/week · ${PROG.split}</div><button class="btn full" onclick="programSheet()">Change goal or days</button>
 <div class="divider" style="margin:20px 0"></div>
 <b>Backup</b><div class="hint" style="margin:4px 0 10px">${S.lastExport?'Last export: '+new Date(S.lastExport).toLocaleDateString():'You have not exported yet.'} Export before re-adding the app icon or clearing Safari data.</div>
 <div class="row"><button class="btn sp" onclick="exportData()">Export</button><label class="btn sp">Import<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>
 <div class="divider" style="margin:20px 0"></div>
 <button class="btn full ghost danger" onclick="ask('This permanently erases all meals, workouts, weights, measurements and photos in this app.','Erase everything',&quot;resetAll()&quot;)">Erase all data</button>
 <div class="hint" style="text-align:center;margin-top:14px">Winter Bulk</div>`)}
function saveSettings(){const c=parseInt($('#s_c').value),p=parseInt($('#s_p').value),w=parseInt($('#s_w').value);
 if(c>1500&&c<7000)S.cal=c;if(p>40&&p<500)S.pro=p;if(w>10&&w<400)S.water=w;save();closeSheet();render();toast('Saved')}
async function exportData(){const ph={};for(const p of S.photos){ph[p.id]=await idbGet(p.id)}
 const blob=new Blob([JSON.stringify({app:'bulk26',v:1,state:S,photos:ph})],{type:'application/json'}),name='winter-bulk-backup-'+today()+'.json';
 S.lastExport=Date.now();save();
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});render();return}}catch(e){if(e&&e.name==='AbortError'){render();return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded');render()}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=='bulk26'||!o.state)throw 0;
  S=Object.assign(blank(),o.state);if(!o.state.v2)S.v2=0;migrate();for(const id in (o.photos||{}))await idbPut(id,o.photos[id]);save();closeSheet();render();toast('Backup restored')}catch(e){toast('That file is not a Winter Bulk backup')}};rd.readAsText(f)}
async function resetAll(){for(const p of S.photos)await idbDel(p.id);S=blank();save();UI.viewDate=today();render();toast('All data erased')}

/* ============ INIT ============ */
load();setProg();applyTheme();
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=today();if(UI.lastToday&&UI.lastToday!==t){UI.viewDate=t;UI.trainDate=t}UI.lastToday=t;render()}});
UI.lastToday=today();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitHdr);

/* ===== MOTION JS ===== */
(function(){
 let sig=null,prevLib=false;
 const SEL='.btn,.wkbtn,.part,.mcard,.seg button,.chip,.dpill';
 document.addEventListener('pointerdown',e=>{if(RM)return;const el=e.target.closest&&e.target.closest(SEL);if(!el)return;
  const r=el.getBoundingClientRect(),z=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='rip';
  sp.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;el.appendChild(sp);setTimeout(()=>sp.remove(),680)},{passive:true});
 document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[onclick]');sig=el?el.getAttribute('onclick'):null;setTimeout(()=>{sig=null},50)},true);
 const snap=()=>[...document.querySelectorAll('#app .ring .rf,#app .big .sf')].map(el=>el.classList.contains('rf')?['strokeDashoffset',el.getAttribute('stroke-dashoffset')]:['strokeDasharray',el.getAttribute('stroke-dasharray')]);
 const _r=render;
 render=function(){const tab=UI.tab,old=document.getElementById('app')&&snap(),oldTab=window.__mt;
  _r();window.__mt=UI.tab;if(RM){UI.riseLast=0;return}
  const app=document.getElementById('app');
  // ring sweep from previous values (same tab only)
  if(old&&oldTab===UI.tab){const els=[...app.querySelectorAll('.ring .rf,.big .sf')];
   if(els.length===old.length){const tg=els.map(el=>el.classList.contains('rf')?el.getAttribute('stroke-dashoffset'):el.getAttribute('stroke-dasharray'));
    let ch=false;els.forEach((el,i)=>{const pr=old[i][1];if(pr!==tg[i]){ch=true;el.style[old[i][0]]=pr}});
    if(ch){void app.offsetWidth;els.forEach((el,i)=>{if(el.style[old[i][0]]){el.style.transition='stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1),stroke-dasharray .9s cubic-bezier(.3,.8,.3,1)';el.style[old[i][0]]=tg[i]}})}}}
  // pop the thing just tapped
  if(sig){const t=[...app.querySelectorAll('[onclick]')].find(x=>x.getAttribute('onclick')===sig);
   if(t&&!t.classList.contains('libbtn')){t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),560)}
   if(sig.indexOf('selDay(')===0)app.querySelectorAll('.ex').forEach((x,i)=>{x.style.animationDelay=i*65+'ms';x.classList.add('rise')})}
  // meal library opening
  const lb=app.querySelector('.libbtn');
  if(lb&&UI.libOpen&&!prevLib){let n=lb.nextElementSibling,i=0;while(n){n.style.animationDelay=Math.min(i,6)*60+'ms';n.classList.add('rise');n=n.nextElementSibling;i++}}
  prevLib=!!(lb&&UI.libOpen);
  // newly logged food
  if(UI.riseLast){UI.riseLast=0;const rows=app.querySelectorAll('.card .mrow');const last=rows[rows.length-1];if(last&&/kcal/.test(last.textContent))last.classList.add('rise')}
 };
})();

/* ===== REMINDERS (push) ===== */
const N_KEY='bulk26_notif';
function nCfg(){try{return JSON.parse(localStorage.getItem(N_KEY))||{}}catch(e){return {}}}
function nSet(o){try{localStorage.setItem(N_KEY,JSON.stringify(Object.assign(nCfg(),o)))}catch(e){}}
function remStatus(){const c=nCfg();if(!('serviceWorker' in navigator)||!('PushManager' in window))return 'Not available here. Reminders need the app added to your Home Screen (iOS 16.4 or newer).';
 if(c.on)return 'On. Food, habit and workout nudges are active. Last sync: '+(c.synced?new Date(c.synced).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'not yet')+'.';
 return 'Off. Needs the reminder server set up first (see the setup guide).'}
const HAB_LBL=[['sl','7 hours of sleep'],['co','supplements'],['wk','daily walk'],['jn','journaling'],['sc','scripture']];
function nState(){const d=today(),dd=getD(d),t=dayTotals(d),dk=dayForDow(dowOf(d));
 const habs=HAB_LBL.filter(([k])=>!hv(dd,k)).map(x=>x[1]);if(!(dd.water>=S.water))habs.push('water');
 const allHabs=HAB_LBL.map(x=>x[1]).concat('water');
 let wo=null;if(dk){const wk=S.workouts[d],wd=PROG.days[dk];let tot=0,dn=0;wd.ex.forEach(e=>{tot+=e.s;((wk&&wk.ex[e.id])||[]).forEach(q=>{if(q&&q.done)dn++})});wo={name:wd.n,fin:!!(wk&&wk.finished),dn,tot}}
 const week=[0,1,2,3,4,5,6].map(w=>{const k=dayForDow(w);return k?PROG.days[k].n:null});
 return {date:d,cal:S.cal,pro:S.pro,carb:carbTarget(),c:t.c,p:t.p,b:t.b,habs,allHabs,wo,week,lastFood:S.lastFoodAt||0}}
let nT=null;
function nPost(path,body){const c=nCfg();if(!c.url||!c.key)return Promise.reject(new Error('no config'));
 return fetch(c.url.replace(/\/+$/,'')+path,{method:body?'POST':'GET',headers:{'x-app-key':c.key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function nSync(now){if(!nCfg().on)return;clearTimeout(nT);const go=()=>nPost('/state',{state:nState()}).then(()=>nSet({synced:Date.now()})).catch(()=>{});if(now)go();else nT=setTimeout(go,4000)}
{const _s=save;save=function(){_s();nSync()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')nSync(true);else nSync(false)});
const urlB64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a};
async function enableNotifs(){
 const url=($('#n_u')||{}).value&&$('#n_u').value.trim(),key=($('#n_k')||{}).value&&$('#n_k').value.trim();
 if(!url||!key){toast('Enter the server address and app key');return}
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Add the app to your Home Screen first');return}
 nSet({url,key});
 try{
  const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifications are blocked. Allow them in iPhone Settings');return}
  const reg=await navigator.serviceWorker.ready;
  const pub=(await nPost('/vapid')).key;
  let sub=await reg.pushManager.getSubscription();
  if(sub){try{const cur=new Uint8Array(sub.options.applicationServerKey),want=urlB64(pub);if(cur.length!==want.length||cur.some((v,i)=>v!==want[i])){await sub.unsubscribe();sub=null}}catch(e){}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(pub)});
  await nPost('/sub',{sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,state:nState()});
  nSet({on:1,synced:Date.now()});toast('Reminders on','check');settingsSheet()
 }catch(e){toast('Could not turn on: '+(e&&e.message||'error'))}}
async function testNotif(){try{const r=await nPost('/test',{});toast(r.status>=200&&r.status<300?'Test sent':'Test failed ('+r.status+')')}catch(e){toast('Test failed: '+(e.message||'error'))}}
async function disableNotifs(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe();await nPost('/unsub',{})}catch(e){}nSet({on:0});toast('Reminders off');settingsSheet()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{const g=e.data&&e.data.go;if(g&&TABS.includes(g))go(g)})}
{const h=location.hash.slice(1);if(TABS.includes(h)){UI.tab=h;render()}}
nSync(false);
</script>
