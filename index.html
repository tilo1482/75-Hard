<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bulk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14110f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<title>Winter Bulk</title>
<style>
:root{
  --bg:#14110f; --card:#1d1916; --card2:#272220; --line:#352f2b;
  --txt:#f3ede8; --dim:#9b9089; --acc:#ff8a3d; --accD:#7a3a12; --onAcc:#1a0e05;
  --pro:#4fd1c5; --water:#63b3ed; --good:#6ee7a0; --warn:#fbbf24; --bad:#f87171;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#faf6f2; --card:#ffffff; --card2:#f1ebe5; --line:#e4dbd2;
    --txt:#1f1a16; --dim:#6f655d; --acc:#e8650f; --accD:#fde3d0; --onAcc:#ffffff;
    --pro:#0f9f93; --water:#2b7bc4; --good:#15803d; --warn:#b45309; --bad:#dc2626; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--txt)}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
.num{font-family:'Rajdhani',-apple-system,sans-serif;font-weight:700;letter-spacing:.3px}

/* header */
#hdr{max-width:540px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:flex-start;gap:8px}
#hdr .ttl{flex:1}
#hdr h1{margin:0;font-size:30px;line-height:1.05;text-transform:uppercase}
#hdr .sub{color:var(--dim);font-size:13px;margin-top:3px}
.iconBtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.iconBtn svg{width:19px;height:19px}
.datestep{display:flex;align-items:center;gap:4px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
#nav .in{display:flex;width:100%;max-width:540px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600;border-radius:12px;position:relative}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--acc)}
#nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card h2 .r{letter-spacing:0;text-transform:none;font-weight:600;font-size:13px;color:var(--acc)}
.sec{font-size:12px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;font-weight:700;margin:20px 2px 8px}
.hint{color:var(--dim);font-size:13px;line-height:1.4}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--dim)}
.pill.acc{background:var(--accD);color:var(--acc)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--acc);color:var(--onAcc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--accD);border-color:var(--acc);color:var(--acc)}

/* rings */
.rings{display:flex;gap:14px;justify-content:space-around}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--card2);stroke-width:9}
.ring .rf{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-family:'Rajdhani',sans-serif;font-size:34px;line-height:1}
.ring .rc span{font-size:12px;color:var(--dim);margin-top:2px;text-align:center;line-height:1.2}
.ringLbl{text-align:center;font-size:12px;color:var(--dim);margin-top:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.togo{text-align:center;margin-top:12px;font-size:14px;color:var(--dim)}
.togo b{color:var(--txt)}

/* meal rows */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;background:none}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.chk.sq{border-radius:9px}
.mbody{flex:1;min-width:0}
.mbody .t{font-weight:700;line-height:1.2}
.mbody .s{font-size:13px;color:var(--dim);margin-top:2px}
.slotTag{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--acc);text-transform:uppercase}
.chev{color:var(--dim);width:18px;height:18px;flex:none}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--dim);font-weight:600;font-size:14px}

/* meter */
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:18px}

/* planner */
.dayHd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dayHd b{font-size:17px}
.dayHd .tot{margin-left:auto;font-size:13px;color:var(--dim)}
.dayCard.today{border-color:var(--acc)}
.pslot{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.pslot:first-of-type{border-top:0}
.pslot .l{width:24px;height:24px;border-radius:8px;background:var(--card2);font-size:12px;font-weight:800;display:grid;place-items:center;color:var(--acc);flex:none}
.pslot .n{flex:1;font-size:15px;font-weight:600;line-height:1.2;min-width:0}
.pslot .n small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.pslot .n.none{color:var(--dim);font-weight:500}
.pslot .ok{color:var(--good);width:18px;height:18px}

/* groceries */
.gro{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.gro:first-of-type{border-top:0}
.gro .nm{flex:1}
.gro.done .nm{opacity:.4;text-decoration:line-through}
.gro .q{color:var(--dim);font-size:14px;text-align:right}

/* workout */
.dpills{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dpill{flex:none;min-width:56px;padding:8px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.dpill b{display:block;font-size:12px;color:var(--dim);letter-spacing:1px}
.dpill span{font-size:13px;font-weight:700}
.dpill.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.dpill.on b{color:var(--onAcc)}
.dpill.done b::after{content:' ✓'}
.dpill.today:not(.on){border-color:var(--acc)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ex.complete{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.ex .eh{display:flex;gap:10px;align-items:flex-start}
.ex .eh b{font-size:17px;line-height:1.2}
.ex .tag{font-size:13px;color:var(--dim);margin-top:3px}
.ex .note{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.35}
.ex .note::before{content:'💡 '}
.sug{margin-top:10px;background:var(--card2);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.4}
.sug b{color:var(--acc)}
.srow{display:flex;align-items:center;gap:8px;margin-top:10px}
.srow .sn{width:20px;text-align:center;color:var(--dim);font-weight:800;font-size:14px}
.srow input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center;font-size:18px;font-weight:700}
.srow input::placeholder{color:var(--dim);opacity:.55;font-weight:600}
.srow input:focus{outline:2px solid var(--acc);border-color:transparent}
.srow .x{color:var(--dim);font-size:13px;flex:none}
.srow.done input{opacity:.6}
.supers{font-size:11px;font-weight:800;color:var(--pro);letter-spacing:1px;margin-top:6px}

/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;
  background:var(--acc);color:var(--onAcc);border-radius:99px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
#timer.on{display:flex}
#timer b{font-family:'Rajdhani',sans-serif;font-size:24px}
#timer button{background:rgba(0,0,0,.18);border-radius:99px;padding:6px 11px;font-weight:800;font-size:13px}

/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
#ov.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  max-height:88vh;overflow-y:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s;
  max-width:560px;margin:0 auto}
#sheet.on{transform:none;visibility:visible}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
#sheet h3{margin:0 0 4px;font-size:22px}
.fld{margin-top:14px}
.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:17px}
.fld input:focus,.fld select:focus{outline:2px solid var(--acc);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-top:10px}
.pick.on{border-color:var(--acc);background:var(--accD)}
.pick .t{font-weight:800;display:flex;justify-content:space-between;gap:8px}
.pick .t span{color:var(--acc);font-size:14px;white-space:nowrap}
.pick .d{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* progress */
.big{font-family:'Rajdhani',sans-serif;font-size:46px;font-weight:700;line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--dim)}
.wk{display:grid;grid-template-columns:34px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;text-align:center}
.wk.hd{color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-top:0}
.wk.cur{background:var(--accD);border-radius:10px}
.wk.fut{opacity:.35}
.wk b:first-child{text-align:left;padding-left:6px}
.goal{margin-bottom:14px}
.goal .gh{display:flex;justify-content:space-between;align-items:baseline}
.goal .gh b{font-size:17px}
.track{position:relative;height:12px;border-radius:99px;background:var(--card2);margin:10px 0 6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc)}
.track u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--txt);opacity:.8}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{aspect-ratio:3/4;border-radius:12px;background:var(--card2) center/cover;position:relative;overflow:hidden}
.photos .ph span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;font-weight:700;padding:14px 6px 5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .ph{aspect-ratio:3/4;border-radius:12px;background:var(--card2) center/cover}
.welcome{background:linear-gradient(135deg,var(--accD),var(--card));border-color:var(--acc)}
.step{display:flex;align-items:center;gap:12px;padding:9px 0}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tip{font-size:13px;color:var(--dim);background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.4}
.divider{height:1px;background:var(--line);margin:12px 0}
</style>
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="app"></main>
<div id="timer"></div>
<nav id="nav"><div class="in"></div></nav>
<div id="ov" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
/* ============ CONFIG ============ */
const KEY='bulk26_v1';
const SETUP='2026-10-12', START='2026-10-19', END='2027-01-10', GOALDATE='2026-12-31';
const RAMP={'2026-10-12':3100,'2026-10-13':3100,'2026-10-14':3300,'2026-10-15':3300,'2026-10-16':3500,'2026-10-17':3500,'2026-10-18':3500};
const SLOTS=[['B','Breakfast'],['L','Lunch'],['D','Dinner'],['S','Snack']];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ============ MEALS ============ */
const MEALS={
B1:{s:'B',n:'Beef & Egg Burrito',c:840,p:54,d:'3 eggs + ¼ cup egg whites scrambled, 2 oz raw 90/10 beef crumbled, 1 oz cheddar, 1 large + 1 small tortilla, salsa.',i:[['egg',3],['eggwhite_cup',.25],['beef90_4oz',.5],['cheddar_oz',1],['tortilla_lg',1.5]]},
B2:{s:'B',n:'Power Oats',c:860,p:50,d:'1 cup dry oats cooked in 1 cup whole milk (+ water). Stir in 1 scoop whey, 1 banana, 2 tbsp peanut butter.',i:[['oats_1/2c',2],['milk_cup',1],['whey',1],['banana',1],['pb_2tbsp',1]]},
B3:{s:'B',n:'Steak, Eggs & Potato Hash',c:780,p:50,d:'4 oz raw sirloin diced, 1 large russet diced, 3 eggs, 1 tbsp olive oil. One pan.',i:[['sirloin_4oz',1],['egg',3],['potato_lg',1],['olive_tbsp',1]]},
B4:{s:'B',n:'Yogurt-Granola Bowl',c:820,p:49,d:'1½ cups plain nonfat Greek yogurt, ⅔ cup granola, 1 banana, 1 tbsp honey, 2 tbsp peanut butter. Zero cooking.',i:[['gyog_cup',1.5],['granola_1/2c',1.25],['banana',1],['honey_tbsp',1],['pb_2tbsp',1]]},
B5:{s:'B',n:'Egg & Cheese Toast Stack',c:810,p:51,d:'3 eggs + ¼ cup egg whites scrambled on 3 slices toast with 1 slice cheese. Plus 1 cup whole milk and 1 banana.',i:[['egg',3],['eggwhite_cup',.25],['bread_slice',3],['cheese_slice',1],['milk_cup',1],['banana',1]]},
L1:{s:'L',n:'Beef Burrito Bowl',c:940,p:54,d:'6 oz raw 90/10 beef (taco seasoning), 1¼ cups cooked rice, ½ cup black beans, 1 oz cheddar, ½ avocado, salsa.',i:[['beef90_4oz',1.5],['rice_cup',1.25],['blackbeans_1/2c',1],['cheddar_oz',1],['avocado_1/2',1]]},
L2:{s:'L',n:'Chicken, Rice & Broccoli',c:970,p:59,d:'7 oz raw chicken breast, 2¼ cups cooked rice, 1 cup broccoli, 2 tbsp olive oil.',i:[['chicken_br_4oz',1.75],['rice_cup',2.25],['broccoli_cup',1],['olive_tbsp',2]]},
L3:{s:'L',n:'Chicken & Loaded Potato',c:970,p:60,d:'6 oz raw chicken breast, 1½ large baked potatoes, 2 tbsp butter, 1 oz cheddar, 1 cup broccoli.',i:[['chicken_br_4oz',1.5],['potato_lg',1.5],['butter_tbsp',2],['cheddar_oz',1],['broccoli_cup',1]]},
L4:{s:'L',n:'Beef Pasta',c:910,p:55,d:'6 oz raw 90/10 beef, 2 cups cooked pasta, ½ cup marinara, 2 tbsp parmesan, ½ tbsp olive oil.',i:[['beef90_4oz',1.5],['pasta_cup',2],['marinara_1/2c',1],['parm_tbsp',2],['olive_tbsp',.5]]},
L5:{s:'L',n:'Chicken Fried Rice',c:940,p:58,d:'6 oz raw chicken thigh, 2 cups cooked rice, 2 eggs, 1 cup mixed veg, 1 tbsp oil, soy sauce.',i:[['chicken_th_4oz',1.5],['rice_cup',2],['egg',2],['olive_tbsp',1],['broccoli_cup',1]]},
D1:{s:'D',n:'Steak & Potatoes',c:1000,p:62,d:'8 oz raw sirloin, 1½ large potatoes, 2 tbsp butter, 1 cup broccoli.',i:[['sirloin_4oz',2],['potato_lg',1.5],['butter_tbsp',2],['broccoli_cup',1]]},
D2:{s:'D',n:'Burger Night',c:990,p:58,d:'7 oz raw 90/10 beef (2 patties), 1 bun, 1 slice cheese, 1½ large potatoes as baked wedges.',i:[['beef90_4oz',1.75],['bun',1],['cheese_slice',1],['potato_lg',1.5]]},
D3:{s:'D',n:'Chicken Thighs, Rice & Veg',c:1010,p:59,d:'8 oz raw boneless thighs, 2 cups cooked rice, 1½ cups broccoli, 2 tbsp olive oil.',i:[['chicken_th_4oz',2],['rice_cup',2],['broccoli_cup',1.5],['olive_tbsp',2]]},
D4:{s:'D',n:'Beef Bolognese',c:1000,p:62,d:'7 oz raw 90/10 beef, 2 cups cooked pasta, ¾ cup marinara, 2 tbsp parmesan, ½ tbsp olive oil.',i:[['beef90_4oz',1.75],['pasta_cup',2],['marinara_1/2c',1.5],['parm_tbsp',2],['olive_tbsp',.5]]},

/* ============ NUTRITION LOGIC ============ */
const mealOf=v=>!v?null:(typeof v==='string'?MEALS[v]:v);
function calTarget(d){const r=RAMP[d];if(r)return Math.min(r,S.cal);if(d<SETUP)return Math.min(3100,S.cal);return S.cal}
function dayTotals(d){const pl=S.plan[d]||{},dd=getD(d);let c=0,p=0;
 SLOTS.forEach(([k])=>{if(dd.eaten[k]){const m=mealOf(pl[k]);if(m){c+=m.c;p+=m.p}}});
 dd.extra.forEach(e=>{c+=e.c;p+=e.p});return {c,p}}
function dayPlanned(d){const pl=S.plan[d]||{};let c=0,p=0,n=0;
 SLOTS.forEach(([k])=>{const m=mealOf(pl[k]);if(m){c+=m.c;p+=m.p;n++}});return {c,p,n}}
function hasLog(d){const dd=S.days[d];if(!dd)return false;return Object.keys(dd.eaten).some(k=>dd.eaten[k])||dd.extra.length>0}

function autoFill(wk){const w=Math.max(0,weekNum(wk));
 for(let i=0;i<7;i++){const d=addD(wk,i);const pl=S.plan[d]||(S.plan[d]={});
  const pick={B:BYSLOT.B[(i+w)%5],L:i<3?BYSLOT.L[(w*2)%5]:BYSLOT.L[(w*2+1)%5],D:BYSLOT.D[(i*2+w)%5],S:BYSLOT.S[(i+w*2)%5]};
  SLOTS.forEach(([k])=>{if(!pl[k])pl[k]=pick[k]})}
 save()}

function groceryFor(wk){const tot={};
 for(let i=0;i<7;i++){const pl=S.plan[addD(wk,i)]||{};
  SLOTS.forEach(([k])=>{const v=pl[k];if(typeof v==='string'&&MEALS[v])MEALS[v].i.forEach(([key,q])=>{tot[key]=(tot[key]||0)+q})})}
 const out={};GCATS.forEach(c=>out[c]=[]);
 Object.keys(tot).forEach(key=>{const g=GI[key];if(g)out[g[1]].push({key,n:g[0],q:g[2](tot[key])})});
 GCATS.forEach(c=>out[c].sort((a,b)=>a.n.localeCompare(b.n)));return out}

/* ============ TRAINING LOGIC ============ */
function e1rm(w,r){if(!w||!r)return 0;if(r<=1)return w;return w*(1+Math.min(r,12)/30)}
function doneSets(date,id){const wk=S.workouts[date];if(!wk||!wk.ex[id])return [];return wk.ex[id].filter(s=>s&&s.done&&(s.r>0))}
function lastSession(id,before){const ds=Object.keys(S.workouts).filter(d=>d<before).sort().reverse();
 for(const d of ds){const s=doneSets(d,id);if(s.length)return {d,sets:s}}return null}
function suggest(ex,date){const L=lastSession(ex.id,date);
 if(!L)return {first:true};
 const ws=L.sets.map(s=>+s.w||0),top=Math.max(...ws),reps=L.sets.map(s=>+s.r||0);
 const allHit=L.sets.length>=ex.s&&reps.every(r=>r>=ex.hi);
 const desc=L.sets.map(s=>(+s.w?s.w:'BW')+'×'+s.r).join(', ');
 if(ex.t){const nr=Math.min(...reps)+5;return {w:0,r:nr,txt:'Last: '+reps.join(', ')+' sec',goal:'Aim for '+nr+' sec each.'}}
 if(allHit&&top>0&&ex.inc){const nw=r1(top+ex.inc);return {w:nw,r:ex.lo,up:true,txt:'Last: '+desc,goal:'You hit the top of the range. <b>Go up to '+nw+' lb</b> and aim for '+ex.lo+'+ reps.'}}
 if(allHit&&!top){return {w:0,r:reps[0]+1,txt:'Last: '+desc,goal:'Add a rep or two — or add weight.'}}
 return {w:top,r:Math.min(ex.hi,Math.min(...reps)+1),txt:'Last: '+desc,goal:'Same weight (<b>'+(top||'BW')+'</b>). Beat last time — aim for '+Math.min(ex.hi,Math.min(...reps)+1)+'+ reps per set.'}}

function baseFor(g){ // baseline = best est. 1RM from the FIRST session where the lift was logged
 const ds=Object.keys(S.workouts).sort();
 for(const d of ds){const s=doneSets(d,g.ex);if(s.length){let best=0,bw=0,br=0;s.forEach(x=>{const e=e1rm(+x.w,+x.r);if(e>best){best=e;bw=+x.w;br=+x.r}});if(best>0)return {d,e:best,w:bw,r:br}}}
 return null}
function bestFor(g){let best=0,d0=null;Object.keys(S.workouts).forEach(d=>{doneSets(d,g.ex).forEach(x=>{const e=e1rm(+x.w,+x.r);if(e>best){best=e;d0=d}})});return best?{e:best,d:d0}:null}
function goalStatus(g){const b=baseFor(g),c=bestFor(g);if(!b||!c)return {none:true};
 const t0=P(b.d).getTime(),t1=P(GOALDATE).getTime(),tn=Math.min(Date.now(),t1);
 const frac=t1>t0?Math.max(0,Math.min(1,(tn-t0)/(t1-t0))):1;
 const exp=b.e+(g.goal-b.e)*frac;const diff=c.e-exp;
 return {b,c,exp,diff,pct:Math.max(0,Math.min(1,(c.e-b.e)/Math.max(1,g.goal-b.e))),expPct:frac,left:Math.max(0,g.goal-c.e)}}

/* ============ WEIGHT / REPORT LOGIC ============ */
function sortedW(){return S.weights.slice().sort((a,b)=>a.d<b.d?-1:1)}
function wAvgWeek(mon){const a=S.weights.filter(x=>x.d>=mon&&x.d<=addD(mon,6));return a.length?a.reduce((s,x)=>s+x.w,0)/a.length:null}
function weekStats(mon){let cs=0,ps=0,n=0,pd=0,tg=0;
 for(let i=0;i<7;i++){const d=addD(mon,i);if(hasLog(d)){const t=dayTotals(d);cs+=t.c;ps+=t.p;n++;tg+=calTarget(d);if(t.p>=S.pro-10)pd++}}
 let wo=0;for(let i=0;i<7;i++){const w=S.workouts[addD(mon,i)];if(w&&w.finished)wo++}
 return {n,avgC:n?cs/n:null,avgP:n?ps/n:null,pDays:pd,wo,wt:wAvgWeek(mon),tgt:n?tg/n:null}}
function report(){const cur=monday(today());const rm=addD(cur,-7);
 if(weekNum(rm)<1)return {none:true,msg:'Your first weekly report appears after Week 1 ends (Sunday, Oct 25).'};
 const st=weekStats(rm);const pts=[];
 for(let i=0;i<4;i++){const m=addD(rm,-7*i);const w=wAvgWeek(m);if(w!=null)pts.push({m,w})}
 const R={mon:rm,wk:weekNum(rm),st};
 if(pts.length<2){R.rec={k:'wait',t:'Need more data',x:'Log a weigh-in in at least two different weeks to see your trend. One reading a week is plenty.'};return R}
 const a=pts[0],b=pts[pts.length-1];const weeks=Math.max(1,diffD(a.m,b.m)/7);R.rate=(a.w-b.w)/weeks;R.weeks=weeks;
 const logged=st.n,belowIntake=st.avgC!=null&&st.avgC<st.tgt*0.93;
 if(logged<4){R.rec={k:'log',t:'Log more days',x:'Only '+logged+' day'+(logged===1?'':'s')+' of food logged last week, so the calorie read is unreliable. Aim for 6–7 days.'};return R}
 if(R.rate<0.5){
  if(belowIntake)R.rec={k:'eat',t:'Eat the plan first',x:'You averaged ~'+fmtN(st.tgt-st.avgC)+' kcal under target and gained '+r1(R.rate)+' lb/wk. The fix is hitting your current number, not raising it.'};
  else R.rec={k:'up',t:'Add ~200 kcal',x:'Gaining '+r1(R.rate)+' lb/wk while hitting your target — below the 0.5–1.25 range. Add a cup of milk or an extra cup of rice per day.',delta:200}
 }else if(R.rate>1.25)R.rec={k:'down',t:'Trim ~175 kcal',x:'Gaining '+r1(R.rate)+' lb/wk — faster than ideal and more of it will be fat. Trim a little.',delta:-175};
 else R.rec={k:'hold',t:'On pace — change nothing',x:'Gaining '+r1(R.rate)+' lb/wk, right in the 0.5–1.25 lb target range. Keep going.'};
 return R}

 meals:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 train:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
 prog:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
const ic=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';

/* ============ SHELL ============ */
function phaseText(d){
 if(d<SETUP)return 'Relax weekend · bulk starts in '+diffD(START,d)+' days';
 if(d<START){const n=diffD(START,d);return 'Setup week · bulk starts '+(n===1?'tomorrow':'in '+n+' days')}
 if(d<=END)return 'Week '+weekNum(d)+' of 12 · Day '+(diffD(d,START)+1)+' of 84';
 return 'Bulk complete — nice work'}
function dayWord(d){const t=today();if(d===t)return 'Today';if(d===addD(t,-1))return 'Yesterday';if(d===addD(t,1))return 'Tomorrow';return DOW[dowOf(d)]+' '+fmtD(d)}
function renderHdr(){
 let ttl='',sub='',extra='';
 if(UI.tab==='today'){ttl=dayWord(UI.viewDate);sub=fmtLong(UI.viewDate)+'<br>'+phaseText(UI.viewDate);
  extra=`<div class="datestep"><button class="iconBtn" onclick="stepDay(-1)" aria-label="Previous day">‹</button><button class="iconBtn" onclick="stepDay(1)" aria-label="Next day">›</button></div>`}
 else if(UI.tab==='meals'){ttl='Meal Plan';sub='Plan the week, tap to log what you eat'}
 else if(UI.tab==='train'){ttl='Training';sub='6-day PPL · progressive overload'}
 else {ttl='Progress';sub=phaseText(today())}
 $('#hdr').innerHTML=`<div class="ttl"><h1 class="num">${ttl}</h1><div class="sub">${sub}</div></div>${extra}<button class="iconBtn" onclick="settingsSheet()" aria-label="Settings">${ic('gear')}</button>`}
function renderNav(){
 const t=[['today','Today'],['meals','Meals'],['train','Train'],['prog','Progress']];
 const dot=!S.weights.length&&UI.tab!=='prog'?'prog':'';
 $('#nav .in').innerHTML=t.map(([k,l])=>`<button class="${UI.tab===k?'on':''}" onclick="go('${k}')">${ic(k)}${l}${dot===k?'<span class="dot"></span>':''}</button>`).join('')}
function render(){const y=window.scrollY;renderHdr();renderNav();
 const v={today:vToday,meals:vMeals,train:vTrain,prog:vProg}[UI.tab]();$('#app').innerHTML=v;window.scrollTo(0,y)}
const $=s=>document.querySelector(s);

/* ============ TODAY ============ */
function ring(val,max,color,big,sub){const r=44,c=2*Math.PI*r,f=Math.max(0,Math.min(1,val/max));
 return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" class="rt"/><circle cx="50" cy="50" r="${r}" class="rf" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 50 50)"/></svg><div class="rc"><b>${big}</b><span>${sub}</span></div></div>`}
function vToday(){
 const d=UI.viewDate,dd=getD(d),pl=S.plan[d]||{},t=dayTotals(d),ct=calTarget(d),pt=S.pro,isT=d===today();
 let h='';
 if(!S.welcomeDone)h+=welcomeCard();
 // rings
 const cl=ct-t.c,pr=pt-t.p;
 h+=`<div class="card"><div class="rings"><div>${ring(t.c,ct,'var(--acc)',fmtN(t.c),'of '+fmtN(ct)+' kcal')}<div class="ringLbl">Calories</div></div>
 <div>${ring(t.p,pt,'var(--pro)',Math.round(t.p),'of '+pt+' g')}<div class="ringLbl">Protein</div></div></div>
 <div class="togo">${cl<=0&&pr<=0?'<b>Targets hit</b> — nice day of eating.':`<b>${cl>0?fmtN(cl)+' kcal':'Calories hit'}</b> and <b>${pr>0?Math.ceil(pr)+' g protein':'protein hit'}</b> to go`}</div>
 ${RAMP[d]?`<div class="tip">Setup-week ramp: today's target is ${fmtN(ct)} kcal, climbing to ${fmtN(S.cal)} by Friday. Skip the snack or trim carbs to match.</div>`:''}</div>`;
 // meals
 h+=`<div class="card"><h2>Meals<span class="r" onclick="go('meals')" style="cursor:pointer">Plan week ›</span></h2>`;
 SLOTS.forEach(([k,nm])=>{const m=mealOf(pl[k]),on=!!dd.eaten[k];
  h+=`<div class="mrow"><button class="chk ${on?'on':''}" onclick="${m?`toggleEaten('${d}','${k}')`:`pickSheet('${d}','${k}')`}" aria-label="Mark ${nm} eaten">${CHECK}</button>
  <div class="mbody" onclick="${m?`mealSheet('${d}','${k}')`:`pickSheet('${d}','${k}')`}" style="cursor:pointer"><div class="slotTag">${nm}</div>${m?`<div class="t">${esc(m.n)}</div><div class="s">${m.c} kcal · ${m.p} g protein</div>`:`<div class="empty">＋ Choose a meal</div>`}</div>${m?CHEV:''}</div>`});
 dd.extra.forEach((e,i)=>{h+=`<div class="mrow"><div class="chk on sq">${CHECK}</div><div class="mbody"><div class="slotTag">Extra</div><div class="t">${esc(e.n||'Food')}</div><div class="s">${e.c} kcal · ${e.p} g protein</div></div><button class="btn sm ghost danger" onclick="delExtra('${d}',${i})" aria-label="Remove">✕</button></div>`});
 h+=`<button class="btn full" style="margin-top:8px" onclick="addFoodSheet('${d}')">＋ Add something else</button></div>`;
 // habits
 const w=dd.water,wp=Math.min(100,w/S.water*100);
 const late=dd.caf.filter(x=>x>='13:00').length;
 h+=`<div class="card"><h2>Daily habits</h2>
 <div class="row" style="margin-bottom:6px"><div class="sp"><b>Water</b> <span class="hint">${w} / ${S.water} oz</span></div><button class="btn sm" onclick="addWater('${d}',-8)">−8</button><button class="btn sm" onclick="addWater('${d}',8)">+8</button><button class="btn sm pri" onclick="addWater('${d}',16)">+16</button></div>
 <div class="bar"><i style="width:${wp}%;background:var(--water)"></i></div>
 <div class="divider"></div>
 ${habit(d,'bed','In bed by 11 PM last night')}${habit(d,'wake','Up by 7 AM')}${habit(d,'cr','Creatine (5 g)')}${habit(d,'co','Collagen (+ vitamin C, pre-lift)')}
 <div class="divider"></div>
 <div class="row"><div class="sp"><b>Energy drinks</b><div class="hint">${dd.caf.length?dd.caf.length+' today'+(late?` · <span style="color:var(--bad)">${late} after 1 PM</span>`:' · all before 1 PM'):'Cutoff is 1 PM · max 2/day'}</div></div>
 <button class="btn sm" onclick="addCaf('${d}',-1)">−</button><button class="btn sm pri" onclick="addCaf('${d}',1)">＋ Drink</button></div></div>`;
 // workout
 const dk=dayForDow(dowOf(d));
 if(dk){const wk=S.workouts[d],fin=wk&&wk.finished;
  h+=`<div class="card"><h2>Today's workout${fin?'<span class="r" style="color:var(--good)">Done ✓</span>':''}</h2><div class="row"><div class="sp"><div class="num" style="font-size:26px">${WK[dk].n}</div><div class="hint">${WK[dk].f}</div></div><button class="btn pri" onclick="openWorkout('${dk}','${d}')">${fin?'View':'Start'}</button></div></div>`}
 else h+=`<div class="card"><h2>Rest day</h2><div class="hint" style="font-size:15px">No lifting. A 30–40 minute easy walk counts as cardio #2 and helps recovery. Weigh in this morning if you haven't.</div></div>`;
 // nudges
 if(isT){const lw=sortedW().slice(-1)[0];
  if(dowOf(d)===0&&!(lw&&lw.d===d))h+=`<div class="card"><h2>Sunday weigh-in</h2><div class="hint" style="margin-bottom:10px">Same conditions every time: morning, after the bathroom, before eating.</div><button class="btn pri full" onclick="weightSheet()">Log today's weight</button></div>`;
  const need=!S.lastExport&&Object.keys(S.days).length>=7||(S.lastExport&&Date.now()-S.lastExport>7*864e5);
  if(need)h+=`<div class="card"><h2>Back up your data</h2><div class="hint" style="margin-bottom:10px">Export a backup so a phone reset or re-adding the app icon can't wipe your progress.</div><button class="btn full" onclick="exportData()">Export backup</button></div>`}
 return h}
function habit(d,k,label){const on=getD(d)[k];return `<div class="mrow" style="padding:9px 0;border-top:0"><button class="chk sq ${on?'on':''}" onclick="toggleHabit('${d}','${k}')">${CHECK}</button><div class="mbody"><div class="t" style="font-weight:600">${label}</div></div></div>`}
function welcomeCard(){const s1=S.weights.length>0,s2=Object.keys(S.plan).length>0,s3=Object.keys(S.days).some(x=>hasLog(x));
 const st=(ok,t,fn)=>`<div class="step" ${fn?`onclick="${fn}" style="cursor:pointer"`:''}><div class="chk sq ${ok?'on':''}">${CHECK}</div><div><b>${t}</b></div></div>`;
 return `<div class="card welcome"><h2>Welcome to the Winter Bulk</h2><div class="hint" style="margin-bottom:6px;color:var(--txt)">Three quick steps to get rolling:</div>
 ${st(s1,'Log your starting weight',"weightSheet()")}${st(s2,'Plan your first week (auto-fill does it in one tap)',"go('meals')")}${st(s3,'Check off meals as you eat them',null)}
 <button class="btn sm full" style="margin-top:8px" onclick="S.welcomeDone=true;save();render()">Got it — hide this</button></div>`}

/* ============ MEALS ============ */
function vMeals(){
 let h=`<div class="seg"><button class="${UI.planSeg==='plan'?'on':''}" onclick="UI.planSeg='plan';render()">Week plan</button><button class="${UI.planSeg==='gro'?'on':''}" onclick="UI.planSeg='gro';render()">Groceries</button></div>`;
 const wk=UI.planWeek,wn=weekNum(wk);
 h+=`<div class="row" style="margin-bottom:14px"><button class="iconBtn" onclick="stepWeek(-1)">‹</button><div class="sp" style="text-align:center"><b>${wn<=0?(wn===0?'Setup week':'Before setup'):'Week '+wn}</b><div class="hint">${fmtD(wk)} – ${fmtD(addD(wk,6))}</div></div><button class="iconBtn" onclick="stepWeek(1)">›</button></div>`;
 if(UI.planSeg==='gro')return h+vGroc(wk);
 h+=`<div class="row" style="margin-bottom:14px"><button class="btn pri sp" onclick="doAutoFill()">✨ Auto-fill empty slots</button><button class="btn" onclick="copyPrevWeek()">Copy last week</button></div>`;
 for(let i=0;i<7;i++){const d=addD(wk,i),pl=S.plan[d]||{},pp=dayPlanned(d),dd=getD(d),isT=d===today(),ct=calTarget(d);
  h+=`<div class="card dayCard ${isT?'today':''}"><div class="dayHd"><b>${DOW[dowOf(d)]} ${P(d).getDate()}</b>${isT?'<span class="pill acc">Today</span>':''}<span class="tot">${pp.n===4?`<b style="color:${pp.c>=ct-150&&pp.c<=ct+200?'var(--good)':'var(--warn)'}">${fmtN(pp.c)}</b> kcal · ${Math.round(pp.p)} g`:pp.n?pp.n+'/4 planned':'Not planned'}</span></div>`;
  SLOTS.forEach(([k,nm])=>{const m=mealOf(pl[k]);
   h+=`<button class="pslot" onclick="pickSheet('${d}','${k}')"><span class="l">${k}</span><span class="n ${m?'':'none'}">${m?esc(m.n)+`<small>${m.c} kcal · ${m.p} g protein</small>`:'＋ Choose '+nm.toLowerCase()}</span>${dd.eaten[k]?`<span class="ok">${CHECK}</span>`:''}${CHEV}</button>`});
  h+=`</div>`}
 h+=`<div class="hint" style="text-align:center;margin:4px 0 14px">Tip: when you pick a lunch, choose "repeat for the next days" to match your Sunday batch prep.</div><button class="btn danger full ghost" onclick="clearWeek()">Clear this week's plan</button>`;
 return h}
function vGroc(wk){const g=groceryFor(wk),done=S.groc[wk]||{};let n=0,h='';
 GCATS.forEach(c=>{if(!g[c].length)return;n+=g[c].length;
  h+=`<div class="sec">${c}</div><div class="card" style="padding:4px 16px">`+g[c].map(it=>`<div class="gro ${done[it.key]?'done':''}"><button class="chk sq ${done[it.key]?'on':''}" onclick="toggleGro('${wk}','${it.key}')">${CHECK}</button><div class="nm">${esc(it.n)}</div><div class="q">${esc(it.q)}</div></div>`).join('')+`</div>`});
 if(!n)return `<div class="card" style="text-align:center"><div style="font-size:40px">🛒</div><b>No meals planned for this week</b><div class="hint" style="margin:6px 0 14px">Your grocery list builds itself from the week plan.</div><button class="btn pri" onclick="doAutoFill();UI.planSeg='gro';render()">Auto-fill the week</button></div>`;
 return `<div class="row" style="margin-bottom:6px"><div class="hint sp">Built from this week's plan. Check things off as you shop.</div><button class="btn sm" onclick="copyGroc('${wk}')">Copy list</button></div>`+h+
 `<div class="tip">Quantities cover cooking only: add salsa, taco seasoning, soy sauce and anything else you need. Check what you already have at home first.</div>`}

/* ============ TRAIN ============ */
function restTxt(s){return s>=120?(s/60)+' min':s+' sec'}
function vTrain(){
 const t=today(),mon=monday(t);const key=UI.trainDay||dayForDow(dowOf(t))||'rest';
 let h=`<div class="dpills">`;
 for(let i=1;i<=6;i++){const k=dayForDow(i),dt=addD(mon,i-1),w=S.workouts[dt];
  h+=`<button class="dpill ${key===k?'on':''} ${dowOf(t)===i?'today':''} ${w&&w.finished?'done':''}" onclick="selDay('${k}')"><b>${DOW[i].toUpperCase()}</b><span>${WK[k].n}</span></button>`}
 h+=`<button class="dpill ${key==='rest'?'on':''} ${dowOf(t)===0?'today':''}" onclick="selDay('rest')"><b>SUN</b><span>Rest</span></button></div>`;
 if(key==='rest')return h+`<div class="card" style="text-align:center"><div style="font-size:44px">😴</div><div class="num" style="font-size:26px">Rest day</div><div class="hint" style="margin:6px 0 14px">Growth happens now. Easy 30–40 min walk (cardio #2), eat the full plan, sleep 8 hours.</div></div>`;
 const wd=WK[key],date=UI.trainDate,wk=S.workouts[date],fin=wk&&wk.finished;
 let totalS=0,doneS=0,vol=0;wd.ex.forEach(e=>{totalS+=e.s;const a=(wk&&wk.ex[e.id])||[];a.forEach(s=>{if(s&&s.done){doneS++;vol+=(+s.w||0)*(+s.r||0)}})});
 h+=`<div class="chips" style="margin-bottom:14px"><span class="hint" style="align-self:center">Logging for:</span>${[0,1,2].map(n=>{const dt=addD(t,-n);return `<button class="chip ${date===dt?'on':''}" onclick="UI.trainDate='${dt}';render()">${n===0?'Today':n===1?'Yesterday':DOW[dowOf(dt)]}</button>`}).join('')}</div>`;
 h+=`<div class="card"><div class="row"><div class="sp"><div class="num" style="font-size:30px;line-height:1">${wd.n}</div><div class="hint" style="margin-top:3px">${wd.f}</div></div><span class="pill ${fin?'good':'acc'}">${fin?'Done ✓':doneS+'/'+totalS+' sets'}</span></div>
 <div class="bar" style="margin-top:12px"><i style="width:${totalS?doneS/totalS*100:0}%"></i></div><div class="tip">${wd.warm}${wd.tip?'<br>'+wd.tip:''}</div></div>`;
 wd.ex.forEach((e,idx)=>{h+=exCard(e,date,wd.ex[idx-1])});
 h+=fin?`<div class="card" style="text-align:center"><b>Workout complete 💪</b><div class="hint" style="margin:4px 0 12px">${doneS} sets · ${fmtN(vol)} lb total volume</div><button class="btn full" onclick="reopenWorkout('${date}')">Reopen workout</button></div>`
  :`<button class="btn pri full" style="padding:16px;font-size:17px" onclick="finishWorkout('${key}')">Finish workout</button>`;
 return h}
function exCard(ex,date,prev){
 const wk=S.workouts[date],arr=(wk&&wk.ex[ex.id])||[],sg=suggest(ex,date),n=Math.max(ex.s,arr.length);
 const nd=arr.filter(s=>s&&s.done).length;
 let sug='';
 if(sg.first)sug=`<div class="sug"><b>First time:</b> ${ex.t?'hold each set for '+ex.lo+' sec':'pick a weight that leaves 2–3 reps in the tank'}. Target ${ex.t?ex.lo+'–'+ex.hi+' sec':ex.lo+'–'+ex.hi+' reps'}. Your numbers become next session's targets.</div>`;
 else sug=`<div class="sug">${sg.txt}<br>${sg.goal}</div>`;
 let rows='',prevW='';
 for(let i=0;i<n;i++){const s=arr[i]||{},dn=!!s.done;
  const wv=(s.w!=null&&s.w!=='')?s.w:'',rv=(s.r!=null&&s.r!=='')?s.r:'';
  const pw=prevW!==''?prevW:(!sg.first&&sg.w!=null?(sg.w||''):'');
  const phW=ex.t?'—':(ex.bw?'BW':(pw!==''?pw:'lb')),phR=sg.first?(ex.t?ex.lo:ex.lo):(sg.r||ex.lo);
  if(wv!=='')prevW=wv;
  rows+=`<div class="srow ${dn?'done':''}"><span class="sn">${i+1}</span>
  ${ex.t?'':`<input id="w_${ex.id}_${i}" type="text" inputmode="decimal" value="${wv}" placeholder="${phW}" onchange="setVal('${date}','${ex.id}',${i})" aria-label="Weight set ${i+1}"><span class="x">lb ×</span>`}
  <input id="r_${ex.id}_${i}" type="text" inputmode="numeric" value="${rv}" placeholder="${phR}" onchange="setVal('${date}','${ex.id}',${i})" aria-label="${ex.t?'Seconds':'Reps'} set ${i+1}">${ex.t?'<span class="x">sec</span>':''}
  <button class="chk ${dn?'on':''}" onclick="toggleSet('${date}','${ex.id}',${i})" aria-label="Complete set ${i+1}">${CHECK}</button></div>`}
 return `<div class="ex ${nd>=ex.s?'complete':''}" id="ex_${ex.id}"><div class="eh"><div class="sp"><b>${esc(ex.n)}</b><div class="tag">${ex.s} × ${ex.lo}–${ex.hi}${ex.t?' sec':' reps'} · rest ${restTxt(ex.rest)}</div></div><span class="pill ${nd>=ex.s?'good':''}">${nd}/${ex.s}</span></div>
 ${ex.note?`<div class="note">${esc(ex.note)}</div>`:''}${sug}${rows}
 <div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="addSet('${date}','${ex.id}')">＋ Add set</button>${ex.ss?'<span class="supers" style="margin-left:auto">SUPERSET WITH NEXT</span>':''}</div></div>`}

/* ============ PROGRESS ============ */
function vProg(){
 let h=`<div class="seg"><button class="${UI.progSeg==='overview'?'on':''}" onclick="UI.progSeg='overview';render()">Overview</button><button class="${UI.progSeg==='strength'?'on':''}" onclick="UI.progSeg='strength';render()">Strength</button><button class="${UI.progSeg==='body'?'on':''}" onclick="UI.progSeg='body';render()">Body</button></div>`;
 return h+({overview:pOverview,strength:pStrength,body:pBody}[UI.progSeg])()}
function pOverview(){
 const ws=sortedW(),last=ws[ws.length-1],first=ws[0];let h='';
 h+=`<div class="card"><h2>Body weight<span class="r" onclick="weightSheet()" style="cursor:pointer">＋ Log</span></h2>`;
 if(!last)h+=`<div class="hint" style="margin-bottom:12px">Log your starting weight to begin the trend line and pace corridor.</div><button class="btn pri full" onclick="weightSheet()">Log weight</button>`;
 else{const ch=last.w-first.w,wks=Math.max(0.01,diffD(last.d,first.d)/7);
  h+=`<div class="row" style="align-items:flex-end"><div><span class="big">${r1(last.w)}</span> <span class="hint">lb</span></div><div class="sp"></div><div style="text-align:right"><div style="font-weight:800;color:${ch>=0?'var(--good)':'var(--warn)'}">${ch>=0?'+':''}${r1(ch)} lb</div><div class="hint">since ${fmtD(first.d)}</div></div></div>${weightChart(ws)}
  <div class="legend"><span><i style="background:var(--acc)"></i>Your weight</span><span><i style="background:var(--good);opacity:.6"></i>Target pace (0.75–1 lb/wk)</span></div>`}
 h+=`</div>`;
 // report
 const R=report();h+=`<div class="card"><h2>Weekly report${R.wk?`<span class="r" style="color:var(--dim)">Week ${R.wk}</span>`:''}</h2>`;
 if(R.none)h+=`<div class="hint">${R.msg}</div>`;
 else{const s=R.st;
  h+=`<div class="kv"><span>Avg calories (${s.n} day${s.n===1?'':'s'} logged)</span><b>${s.avgC!=null?fmtN(s.avgC):'—'}</b></div><div class="kv"><span>Avg protein</span><b>${s.avgP!=null?Math.round(s.avgP)+' g':'—'}</b></div><div class="kv"><span>Protein days hit</span><b>${s.pDays}/7</b></div><div class="kv"><span>Workouts finished</span><b>${s.wo}/6</b></div><div class="kv"><span>Avg weight</span><b>${s.wt!=null?r1(s.wt)+' lb':'—'}</b></div>`;
  const rec=R.rec,col={up:'acc',down:'warn',hold:'good',eat:'warn',wait:'',log:''}[rec.k];
  h+=`<div class="tip" style="margin-top:12px;background:var(--card2)"><span class="pill ${col}">${rec.t}</span><div style="margin-top:8px;color:var(--txt)">${rec.x}</div>${R.rate!=null?`<div class="hint" style="margin-top:6px">Trend: ${R.rate>=0?'+':''}${r1(R.rate)} lb/week over ${r1(R.weeks)} week${R.weeks>1?'s':''}</div>`:''}</div>`;
  if(rec.delta){const done=S.applied[R.mon];h+=done?`<div class="hint" style="margin-top:10px">Applied: target is now ${fmtN(S.cal)} kcal.</div>`:`<button class="btn pri full" style="margin-top:10px" onclick="applyCal('${R.mon}',${rec.delta})">Set target to ${fmtN(S.cal+rec.delta)} kcal</button>`}}
 h+=`</div>`;
 // week by week
 const cw=weekNum(today());
 h+=`<div class="card"><h2>Week by week</h2><div class="wk hd"><span>Wk</span><span>Weight</span><span>Cal/day</span><span>Protein</span><span>Lifts</span></div>`;
 for(let w=0;w<=12;w++){const m=addD(START,(w-1)*7),s=weekStats(m),fut=w>cw;
  h+=`<div class="wk ${w===cw?'cur':''} ${fut?'fut':''}"><b>${w===0?'S':w}</b><span>${s.wt!=null?r1(s.wt):'—'}</span><span>${s.avgC!=null?fmtN(s.avgC):'—'}</span><span>${s.n?s.pDays+'/7':'—'}</span><span>${s.wo||s.n||s.wt!=null?s.wo+'/6':'—'}</span></div>`}
 h+=`</div><div class="hint" style="text-align:center">S = setup week. Protein = days within 10 g of target.</div>`;
 return h}
function weightChart(ws){
 const W=320,H=170,L=34,R=8,T=10,B=22,x0=P(ws[0].d<SETUP?ws[0].d:SETUP).getTime(),x1=P(END).getTime();
 const o=ws.find(x=>x.d>=SETUP)||ws[0],w0=o.w,t0=Math.max(P(o.d).getTime(),P(START).getTime()),wks=(x1-t0)/6048e5,lo=w0+0.75*wks,hi=w0+1*wks;

let _db=null;const _mem={};
function idbOpen(){return new Promise(res=>{if(_db)return res(_db);try{const r=indexedDB.open('bulk26',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
async function idbPut(id,v){const db=await idbOpen();if(!db){_mem[id]=v;return}return new Promise(res=>{try{const t=db.transaction('ph','readwrite');t.objectStore('ph').put(v,id);t.oncomplete=()=>res();t.onerror=()=>{_mem[id]=v;res()}}catch(e){_mem[id]=v;res()}})}
async function idbGet(id){const db=await idbOpen();if(!db)return _mem[id];return new Promise(res=>{try{const q=db.transaction('ph').objectStore('ph').get(id);q.onsuccess=()=>res(q.result||_mem[id]);q.onerror=()=>res(_mem[id])}catch(e){res(_mem[id])}})}
async function idbDel(id){delete _mem[id];const db=await idbOpen();if(!db)return;return new Promise(res=>{try{const t=db.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}

 render();
 startTimer(ex.ss?30:ex.rest)}
function addSet(date,id){const wk=ensureWk(date),arr=wk.ex[id]||(wk.ex[id]=[]),ex=EXBYID[id];while(arr.length<ex.s)arr.push({});arr.push({});save();render()}
function finishWorkout(key){const date=UI.trainDate,wk=ensureWk(date);wk.finished=true;wk.day=key;save();stopTimer();render();toast('Workout complete 💪');window.scrollTo(0,0)}
function reopenWorkout(date){ensureWk(date).finished=false;save();render()}

/* ============ TIMER ============ */
let tInt=null;
function startTimer(sec){UI.timerEnd=Date.now()+sec*1000;tickTimer();clearInterval(tInt);tInt=setInterval(tickTimer,250)}
function addTimer(s){UI.timerEnd+=s*1000;tickTimer()}
function stopTimer(){UI.timerEnd=0;clearInterval(tInt);$('#timer').classList.remove('on')}
function tickTimer(){const el=$('#timer'),left=Math.ceil((UI.timerEnd-Date.now())/1000);
 if(UI.timerEnd===0)return;
 if(left<=0){el.classList.remove('on');clearInterval(tInt);UI.timerEnd=0;beep();toast('Rest over — next set');return}
 el.classList.add('on');el.innerHTML=`Rest <b>${Math.floor(left/60)}:${pad(left%60)}</b><button onclick="addTimer(15)">+15s</button><button onclick="stopTimer()">Skip</button>`}
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();A.close()},220)}catch(e){}}

/* ============ SETTINGS / BACKUP ============ */
function settingsSheet(){
 openSheet(`<h3>Settings</h3>
 <div class="grid2"><div class="fld"><label>Calories / day</label><input id="s_c" type="text" inputmode="numeric" value="${S.cal}"></div><div class="fld"><label>Protein (g)</label><input id="s_p" type="text" inputmode="numeric" value="${S.pro}"></div></div>
 <div class="fld"><label>Water (oz / day)</label><input id="s_w" type="text" inputmode="numeric" value="${S.water}"></div>
 <button class="btn pri full" style="margin-top:14px" onclick="saveSettings()">Save targets</button>
 <div class="divider" style="margin:20px 0"></div>
 <b>Backup</b><div class="hint" style="margin:4px 0 10px">${S.lastExport?'Last export: '+new Date(S.lastExport).toLocaleDateString():'You have not exported yet.'} Export before re-adding the app icon or clearing Safari data.</div>
 <div class="row"><button class="btn sp" onclick="exportData()">Export</button><label class="btn sp">Import<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>
 <div class="divider" style="margin:20px 0"></div>
 <button class="btn full ghost danger" onclick="ask('This permanently erases all meals, workouts, weights, measurements and photos in this app.','Erase everything',&quot;resetAll()&quot;)">Erase all data</button>
 <div class="hint" style="text-align:center;margin-top:14px">Winter Bulk · Oct 19, 2026 – Jan 10, 2027</div>`)}
function saveSettings(){const c=parseInt($('#s_c').value),p=parseInt($('#s_p').value),w=parseInt($('#s_w').value);
 if(c>1500&&c<7000)S.cal=c;if(p>40&&p<500)S.pro=p;if(w>10&&w<400)S.water=w;save();closeSheet();render();toast('Saved')}
async function exportData(){const ph={};for(const p of S.photos){ph[p.id]=await idbGet(p.id)}
 const blob=new Blob([JSON.stringify({app:'bulk26',v:1,state:S,photos:ph})],{type:'application/json'}),name='winter-bulk-backup-'+today()+'.json';
 S.lastExport=Date.now();save();
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});render();return}}catch(e){if(e&&e.name==='AbortError'){render();return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded');render()}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{try{const o=JSON.parse(rd.result);if(!o||o.app!=='bulk26'||!o.state)throw 0;
  S=Object.assign(blank(),o.state);for(const id in (o.photos||{}))await idbPut(id,o.photos[id]);save();closeSheet();render();toast('Backup restored')}catch(e){toast('That file is not a Winter Bulk backup')}};rd.readAsText(f)}
async function resetAll(){for(const p of S.photos)await idbDel(p.id);S=blank();save();UI.viewDate=today();render();toast('All data erased')}

/* ============ INIT ============ */
load();
if(today()>=START)UI.planWeek=monday(today());
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=today();if(UI.lastToday&&UI.lastToday!==t){UI.viewDate=t;UI.trainDate=t}UI.lastToday=t;render()}});
UI.lastToday=today();
</script>
</body>
